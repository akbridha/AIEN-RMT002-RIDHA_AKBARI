# ---------------------------------------------------------------------------
# Airflow untuk pipeline milestone P1M1.
# Mode PIPELINE_MODE=real (default) menjalankan pipeline sesungguhnya.
# Set PIPELINE_MODE=simulate pada .env / environment host untuk simulasi
# tanpa koneksi database dan tanpa operasi ingestion/build/transform nyata.
# Metadata Airflow memakai SQLite bawaan image (cukup untuk simulasi lokal).
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  image: milestone1-airflow:2.10.4
  user: "50000:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    PIPELINE_MODE: ${PIPELINE_MODE:-real}
    RAW_DATA_DIR: /app/data/raw
    SCHEMAS_DIR: /app/database/schemas
    PYTHONPATH: /app
    # Keep Docker service DNS authoritative over LOCAL_DATABASE_URL in .env.
    LOCAL_DATABASE_URL: ""
    LOCAL_POSTGRES_HOST: postgres
    LOCAL_POSTGRES_PORT: 5432
    LOCAL_POSTGRES_DB: retail_analytics
    LOCAL_POSTGRES_USER: retail
    LOCAL_POSTGRES_PASSWORD: retail
  volumes:
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./:/app

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data

  nl2sql-api:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      ANALYTICS_DB_TARGET: local
      # Keep Docker service DNS authoritative over LOCAL_DATABASE_URL in .env.
      LOCAL_DATABASE_URL: ""
      LOCAL_POSTGRES_HOST: postgres
      LOCAL_POSTGRES_PORT: 5432
      LOCAL_POSTGRES_DB: retail_analytics
      LOCAL_POSTGRES_USER: retail
      LOCAL_POSTGRES_PASSWORD: retail
      NL2SQL_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app

  analytics-ui:
    build: .
    environment:
      ENGINE_URL: http://nl2sql-api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    depends_on:
      - nl2sql-api
    volumes:
      - ./:/app

  # --- Airflow (simulasi pipeline milestone P1M1) --------------------------
  airflow-init:
    <<: *airflow-common
    # Berjalan sebagai UID 50000 (bukan root) agar file SQLite pada volume
    # airflow_data dimiliki user yang sama dengan webserver/scheduler.
    command: >
      bash -c "airflow db migrate || true;
      airflow users create --username airflow --password airflow
      --firstname Admin --lastname User --role Admin
      --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"  # 8080 dipakai aplikasi lain di host; UI Airflow di 8081
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  retail_postgres_data:
  airflow_data:
