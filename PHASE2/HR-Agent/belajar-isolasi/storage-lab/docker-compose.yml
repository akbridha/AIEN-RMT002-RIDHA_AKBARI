services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr_postgres_lab
    environment:
      POSTGRES_DB: hr_assistant
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_app -d hr_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_storage_data:
